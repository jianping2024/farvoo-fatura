# One-shot: remove mistaken fiscal-agent-v0.4.21 release + assets after revert on main.
name: Delete release fiscal-agent-v0.4.21 (one-shot)

on:
  push:
    branches: [main]
    paths:
      - .github/triggers/delete-release-0.4.21

permissions:
  contents: write

jobs:
  delete-release:
    runs-on: ubuntu-latest
    steps:
      - name: Delete GitHub Release and tag (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fiscal-agent-v0.4.21 --yes --repo "${{ github.repository }}" || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/fiscal-agent-v0.4.21" || true
