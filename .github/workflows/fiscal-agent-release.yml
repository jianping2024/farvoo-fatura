# Windows installer release. Business-logic changes must pass test-linux first.
# Never put two `run:` keys in one step (YAML keeps only the last).
# Production artifacts: GitHub Actions only — do not substitute local macOS cross-compile.
name: fiscal-agent-release

on:
  push:
    tags:
      - 'fiscal-agent-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == fiscal-agent-v* ]]; then
            echo "version=${GITHUB_REF_NAME#fiscal-agent-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(tr -d '\r\n' < apps/fiscal-agent/VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/fiscal-agent/go.mod
          cache-dependency-path: apps/fiscal-agent/go.sum

      - name: Test and vet
        working-directory: apps/fiscal-agent
        run: |
          go test ./...
          go vet ./...

      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/fiscal-agent-v') || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p apps/fiscal-agent/dist
          bash scripts/fiscal-agent-release-body.sh "${{ steps.ver.outputs.version }}" > apps/fiscal-agent/dist/RELEASE_BODY.md
          head -n 12 apps/fiscal-agent/dist/RELEASE_BODY.md

      - name: Upload release body artifact
        if: startsWith(github.ref, 'refs/tags/fiscal-agent-v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-body
          path: apps/fiscal-agent/dist/RELEASE_BODY.md
          retention-days: 1

  release:
    needs: test-linux
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/fiscal-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/fiscal-agent/go.mod

      - name: Read version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == fiscal-agent-v* ]]; then
            echo "version=${GITHUB_REF_NAME#fiscal-agent-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify VERSION file matches tag
        if: startsWith(github.ref, 'refs/tags/fiscal-agent-v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#fiscal-agent-v}"
          FILE_VER="$(tr -d '\r\n' < VERSION)"
          if [[ "$TAG_VER" != "$FILE_VER" ]]; then
            echo "::error::Tag fiscal-agent-v$TAG_VER does not match VERSION ($FILE_VER)"
            exit 1
          fi
          echo "Version OK: $TAG_VER"

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Build release (amd64 Setup + zip)
        shell: pwsh
        run: .\scripts\build-release.ps1 -Amd64Only -Version "${{ steps.ver.outputs.version }}"

      - name: Download release body
        if: startsWith(github.ref, 'refs/tags/fiscal-agent-v')
        uses: actions/download-artifact@v4
        with:
          name: release-body
          path: apps/fiscal-agent/dist

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/fiscal-agent-v')
        with:
          tag_name: ${{ github.ref_name }}
          name: Farvoo Fiscal Agent ${{ steps.ver.outputs.version }}
          body_path: apps/fiscal-agent/dist/RELEASE_BODY.md
          files: |
            apps/fiscal-agent/dist/FarvooFiscalAgent-Setup-amd64.exe
            apps/fiscal-agent/dist/FarvooFiscalAgent-windows-amd64.zip
            apps/fiscal-agent/dist/FarvooFiscalClient-Setup-amd64.exe
            apps/fiscal-agent/dist/FarvooFiscalClient-windows-amd64.zip
            apps/fiscal-agent/dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: farvoo-fiscal-agent-${{ steps.ver.outputs.version }}
          path: apps/fiscal-agent/dist/

      - name: Upload dist on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: farvoo-fiscal-agent-build-debug
          path: apps/fiscal-agent/dist/
          if-no-files-found: ignore

  verify-release:
    needs: release
    if: startsWith(github.ref, 'refs/tags/fiscal-agent-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert GitHub Release has required assets
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            resp=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
            if echo "$resp" | grep -q '"assets"'; then
              names=$(echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); print('\n'.join(a['name'] for a in d.get('assets',[])))")
              echo "$names"
              for required in FarvooFiscalAgent-Setup-amd64.exe FarvooFiscalAgent-windows-amd64.zip FarvooFiscalClient-Setup-amd64.exe FarvooFiscalClient-windows-amd64.zip SHA256SUMS; do
                echo "$names" | grep -qx "$required" || { echo "Missing asset: $required"; sleep 10; continue 2; }
              done
              echo "All required release assets present."
              exit 0
            fi
            echo "Waiting for release assets ($i/30)..."
            sleep 10
          done
          echo "::error::Release $TAG missing required assets after 5 minutes"
          exit 1
