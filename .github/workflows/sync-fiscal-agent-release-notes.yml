# Sync GitHub Release description from apps/fiscal-agent/RELEASE_NOTES.md.
name: Sync fiscal agent release notes

on:
  push:
    branches: [main]
    paths:
      - apps/fiscal-agent/RELEASE_NOTES.md
      - scripts/fiscal-agent-release-body.sh
      - scripts/patch-fiscal-agent-release-body.sh
      - .github/workflows/sync-fiscal-agent-release-notes.yml
  workflow_dispatch:
    inputs:
      version:
        description: Semver (leave empty to use apps/fiscal-agent/VERSION)
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # A VERSION bump means a release is in flight: fiscal-agent-release.yml
      # creates the Release with this body itself, so only post-release note
      # edits need patching here.
      - name: Skip if this push bumps VERSION
        id: gate
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git fetch --quiet --depth=1 origin "$BEFORE"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BEFORE" HEAD -- apps/fiscal-agent/VERSION; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION changed; fiscal-agent-release publishes the notes. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch release body on GitHub
        if: steps.gate.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(tr -d '\r\n' < apps/fiscal-agent/VERSION)"
          fi
          echo "Syncing release notes for fiscal-agent-v${VERSION} ..."
          bash scripts/patch-fiscal-agent-release-body.sh "$VERSION"
