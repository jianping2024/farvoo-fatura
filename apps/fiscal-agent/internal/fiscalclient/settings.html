<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<title>连接 Agent</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: #1a1a1a; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font-size: 14px; }
  .actions { margin-top: 20px; display: flex; gap: 8px; }
  button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
  #msg { margin-top: 12px; min-height: 1.2em; color: #b00020; }
</style>
</head>
<body>
  <h2>Farvoo 开票 · 连接 Agent</h2>
  <p>输入运行 Farvoo Fiscal Agent 的电脑 IP（店网地址）。</p>
  <label>Agent IP / 主机名<input id="host" autocomplete="off" /></label>
  <label>端口<input id="port" value="17880" autocomplete="off" /></label>
  <div id="msg"></div>
  <div class="actions">
    <button type="button" id="test">测试连接</button>
    <button type="button" id="save">保存并打开</button>
    <button type="button" id="cancel">取消</button>
  </div>
<script>
  const hostEl = document.getElementById('host');
  const portEl = document.getElementById('port');
  const msgEl = document.getElementById('msg');
  hostEl.value = {{.HostJSON}};
  portEl.value = {{.PortJSON}};
  function showMsg(text, ok) {
    msgEl.textContent = text || '';
    msgEl.style.color = ok ? '#0a7' : '#b00020';
  }
  document.getElementById('test').onclick = async () => {
    showMsg('测试中…', true);
    try {
      const r = await testConnection(hostEl.value, portEl.value);
      showMsg(r || '连接成功', true);
    } catch (e) { showMsg(String(e), false); }
  };
  // Save closes via Go finishSettings (Terminate). Do not also call closeSettings.
  document.getElementById('save').onclick = async () => {
    showMsg('保存中…', true);
    try {
      await saveSettings(hostEl.value, portEl.value);
    } catch (e) { showMsg(String(e), false); }
  };
  document.getElementById('cancel').onclick = () => { closeSettings(''); };
</script>
</body>
</html>
